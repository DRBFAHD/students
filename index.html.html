<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير أداء الطلاب — النخبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080d1a;
  --surface:   #0f1629;
  --surface2:  #151f35;
  --border:    rgba(255,255,255,.07);
  --border2:   rgba(255,255,255,.12);
  --text:      #f0f4ff;
  --sub:       #7b8db0;
  --sub2:      #4a5880;

  --gold:   #f5c542;
  --gold2:  #ffaa00;
  --green:  #22d3a5;
  --green2: #0d9e6e;
  --orange: #ff8c42;
  --orange2:#e06020;
  --red:    #ff4d6d;
  --red2:   #c0143c;
  --blue:   #4f8ef7;
  --blue2:  #1a5eed;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family:'Cairo','Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  min-height:100vh;
}

/* ══ BACKGROUND MESH ══ */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(79,142,247,.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(34,211,165,.05) 0%, transparent 55%),
    radial-gradient(ellipse 50% 60% at 50% 50%, rgba(245,197,66,.03) 0%, transparent 65%);
}

/* ══ HEADER ══ */
.header {
  position:relative; z-index:10;
  padding:3rem 2rem 2rem;
  text-align:center;
  border-bottom:1px solid var(--border);
}
.header-eyebrow {
  font-size:.72rem; letter-spacing:.25em; text-transform:uppercase;
  color:var(--blue); margin-bottom:.75rem; font-weight:600;
}
.header h1 {
  font-size:clamp(1.6rem,4vw,2.6rem); font-weight:900;
  background:linear-gradient(135deg,#fff 0%,#a0b8ff 50%,#6ee7d4 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; line-height:1.15; margin-bottom:.6rem;
}
.header-sub { font-size:.875rem; color:var(--sub); font-weight:400; }

.kpi-strip {
  display:flex; flex-wrap:wrap; justify-content:center; gap:12px;
  margin-top:2rem;
}
.kpi-pill {
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:50px; padding:.5rem 1.4rem;
  display:flex; align-items:center; gap:.6rem;
  font-size:.8rem;
}
.kpi-pill .kv { font-weight:800; font-size:1.05rem; }
.kpi-pill .kl { color:var(--sub); }

/* ══ TOOLBAR ══ */
.toolbar {
  position:sticky; top:0; z-index:50;
  background:rgba(8,13,26,.85); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:.9rem 1.5rem;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
}
.search {
  flex:1; min-width:200px;
  background:var(--surface2); border:1px solid var(--border2);
  border-radius:10px; padding:.55rem 1rem;
  color:var(--text); font-family:inherit; font-size:.875rem;
  outline:none; transition:.2s;
}
.search:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,142,247,.15); }
.filter-btn {
  padding:.45rem 1.1rem; border-radius:50px; font-size:.78rem; font-weight:600;
  border:1px solid var(--border2); background:var(--surface2);
  color:var(--sub); cursor:pointer; transition:.2s; font-family:inherit;
  white-space:nowrap;
}
.filter-btn.on { border-color:transparent; color:#0f1629; }
.filter-btn.on.f-all    { background:var(--blue); color:#fff; }
.filter-btn.on.f-top    { background:linear-gradient(135deg,var(--gold),var(--gold2)); }
.filter-btn.on.f-up     { background:linear-gradient(135deg,var(--green),var(--green2)); color:#fff; }
.filter-btn.on.f-down   { background:linear-gradient(135deg,var(--red),var(--red2)); color:#fff; }
.filter-btn.on.f-watch  { background:linear-gradient(135deg,var(--orange),var(--orange2)); color:#fff; }

/* ══ GRID ══ */
.grid {
  position:relative; z-index:1;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px; padding:2rem 1.5rem;
}

/* ══ CARD ══ */
.card {
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:24px;
  overflow:hidden;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s;
  cursor:default;
  animation:cardIn .5s both;
}
.card:hover {
  transform:translateY(-6px) scale(1.01);
  box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px var(--accent,var(--blue)) inset;
}

@keyframes cardIn {
  from { opacity:0; transform:translateY(20px) scale(.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

/* Top glow strip */
.card-glow {
  height:3px;
  background:var(--grad);
}

/* HEADER ZONE */
.card-head {
  padding:1.25rem 1.4rem .8rem;
  display:flex; align-items:flex-start; gap:.75rem;
}
.rank-badge {
  min-width:38px; height:38px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:.95rem;
  background:var(--grad); flex-shrink:0;
}
.card-meta { flex:1; }
.card-name {
  font-size:.95rem; font-weight:800; line-height:1.25;
  color:var(--text); margin-bottom:.3rem;
}
.card-period {
  font-size:.7rem; color:var(--sub);
  display:flex; align-items:center; gap:.3rem;
}
.trend-chip {
  display:inline-flex; align-items:center; gap:3px;
  padding:2px 7px; border-radius:20px; font-size:.68rem; font-weight:700;
}
.trend-up   { background:rgba(34,211,165,.15); color:var(--green); }
.trend-down { background:rgba(255,77,109,.15);  color:var(--red); }
.trend-flat { background:rgba(123,141,176,.12); color:var(--sub); }

/* CIRCLE SECTION */
.circle-section {
  padding:.5rem 1.4rem 1rem;
  display:flex; align-items:center; gap:1.2rem;
}
.circle-wrap { position:relative; flex-shrink:0; }
.circle-wrap svg { transform:rotate(-90deg); overflow:visible; }
.circle-bg { fill:none; stroke:rgba(255,255,255,.06); stroke-width:8; }
.circle-prog {
  fill:none; stroke-width:8; stroke-linecap:round;
  transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
}
.circle-inner {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.circle-score {
  font-size:1.9rem; font-weight:900; line-height:1;
  background:var(--grad); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; background-clip:text;
}
.circle-denom { font-size:.68rem; color:var(--sub); margin-top:1px; }

/* Side stats */
.side-stats { flex:1; display:flex; flex-direction:column; gap:.55rem; }
.stat-row {
  display:flex; align-items:center; gap:.6rem;
  background:var(--surface2); border-radius:10px; padding:.5rem .75rem;
}
.stat-icon { font-size:1rem; flex-shrink:0; }
.stat-body { flex:1; }
.stat-label { font-size:.62rem; color:var(--sub); margin-bottom:1px; }
.stat-value { font-size:.85rem; font-weight:700; color:var(--text); }
.stat-bar-wrap {
  width:100%; height:3px; background:rgba(255,255,255,.07);
  border-radius:2px; overflow:hidden; margin-top:3px;
}
.stat-bar { height:100%; border-radius:2px; }

/* SPARKLINE */
.spark-section { padding:0 1.4rem .9rem; }
.spark-label { font-size:.62rem; color:var(--sub2); margin-bottom:.35rem; letter-spacing:.05em; }
.spark-canvas-wrap { height:44px; position:relative; }

/* TERM BARS */
.terms-section { padding:0 1.4rem .9rem; }
.term-row { display:flex; align-items:center; gap:.7rem; margin-bottom:.4rem; }
.term-lbl {
  font-size:.68rem; color:var(--sub); min-width:52px; font-weight:600;
}
.term-track {
  flex:1; height:5px; background:rgba(255,255,255,.06);
  border-radius:3px; overflow:hidden;
}
.term-fill { height:100%; border-radius:3px; transition:width 1s .3s; }
.term-val { font-size:.72rem; font-weight:700; min-width:34px; text-align:left; }

/* FOOTER */
.card-footer {
  padding:.9rem 1.4rem 1.1rem;
  border-top:1px solid var(--border);
  display:flex; align-items:center; gap:.75rem;
}
.grade-badge {
  padding:.35rem .9rem; border-radius:20px; font-size:.75rem; font-weight:700;
  background:var(--grad);
  color:#0a0e1a;
  white-space:nowrap; flex-shrink:0;
}
.smart-comment {
  font-size:.72rem; color:var(--sub); line-height:1.45; flex:1;
  font-style:italic;
}

/* Crown & sad decorators */
.crown-badge {
  display:inline-block;
  font-size:1.35rem;
  margin-left:.3rem;
  vertical-align:middle;
  animation:crownFloat 2.5s ease-in-out infinite;
  filter:drop-shadow(0 0 6px rgba(245,197,66,.7));
  transform-origin:center bottom;
}
.crown-gold  { filter:drop-shadow(0 0 8px rgba(245,197,66,.9)); }
.crown-silver{ filter:drop-shadow(0 0 6px rgba(79,142,247,.8)); font-size:1.1rem; }

@keyframes crownFloat {
  0%,100% { transform:translateY(0) rotate(-5deg); }
  50%      { transform:translateY(-4px) rotate(5deg); }
}

.sad-badge {
  display:inline-block;
  font-size:1.25rem;
  margin-left:.3rem;
  vertical-align:middle;
  animation:sadBob 3s ease-in-out infinite;
  filter:drop-shadow(0 0 4px rgba(255,77,109,.5));
}
@keyframes sadBob {
  0%,100% { transform:translateY(0) rotate(0deg); }
  30%      { transform:translateY(2px) rotate(-8deg); }
  70%      { transform:translateY(1px) rotate(5deg); }
}

/* NO RESULTS */
.no-res {
  grid-column:1/-1; text-align:center;
  padding:4rem 2rem; color:var(--sub); font-size:.9rem;
}
.no-res span { font-size:2.5rem; display:block; margin-bottom:.75rem; }

/* ══ PRINT ══ */
@media print {
  body { background:#fff !important; color:#000 !important; }
  .toolbar, .header-eyebrow { display:none; }
  .card { break-inside:avoid; border:1px solid #ddd !important; background:#fff !important; }
  .card-name, .circle-score { color:#000 !important; }
  .stat-label, .sub, .spark-label, .smart-comment { color:#555 !important; }
  .grid { gap:12px; }
}

@media(max-width:600px){
  .circle-section { flex-direction:column; align-items:center; }
  .side-stats { width:100%; }
}
</style>
</head>

  if(f>=38) return {
    label:"ممتاز جدا", cat:"top",
    grad:"linear-gradient(135deg,#f5c542,#ffaa00)",
    stroke:"url(#gGold)", c1:"#f5c542", c2:"#ffaa00",
    comment:"أداء استثنائي يعكس التزاماً ومثابرةً نادرَين — استمر على هذا المسار المتميز."
  };
  if(f>=34) return {
    label:"ممتاز", cat:"top",
    grad:"linear-gradient(135deg,#4f8ef7,#22d3a5)",
    stroke:"url(#gBlue)", c1:"#4f8ef7", c2:"#22d3a5",
    comment:"مستوى رفيع ومتسق — طالب يُوثَق به ويُبنى عليه."
  };
  if(f>=30) return {
    label:"جيد جدا", cat:"normal",
    grad:"linear-gradient(135deg,#22d3a5,#0d9e6e)",
    stroke:"url(#gGreen)", c1:"#22d3a5", c2:"#0d9e6e",
    comment:"أداء قوي مع فرص واضحة للوصول إلى القمة بمزيد من الانتظام."
  };
  if(f>=26) return {
    label:"جيد", cat:"normal",
    grad:"linear-gradient(135deg,#60a5fa,#818cf8)",
    stroke:"url(#gPurple)", c1:"#60a5fa", c2:"#818cf8",
    comment:"إمكانات جيدة، والحضور المنتظم سيصنع فارقاً ملموساً."
  };
  if(f>=20) return {
    label:"مقبول", cat:"watch",
    grad:"linear-gradient(135deg,#ff8c42,#e06020)",
    stroke:"url(#gOrange)", c1:"#ff8c42", c2:"#e06020",
    comment:"يحتاج إلى دعم ومتابعة — الإمكانات موجودة وتحتاج إلى توجيه."
  };
  return {
    label:"ضعيف", cat:"watch",
    grad:"linear-gradient(135deg,#ff4d6d,#c0143c)",
    stroke:"url(#gRed)", c1:"#ff4d6d", c2:"#c0143c",
    comment:"يستلزم تدخلاً عاجلاً — الغياب وانعدام الحفظ المنتظم هما الأثقل."
  };
}

function trendCat(s){
  const t=s.trend, f=final40(s);
  if(f>=38) return 'top';
  if(t>=1)  return 'up';
  if(t<=-1.5) return 'down';
  if(f<25||s.absent>=12||s.mem>=7) return 'watch';
  return 'normal';
}

const sparkCache={};
let activeFilter='all';

/* ══ RENDER ══ */
function render(){
  const grid=document.getElementById('grid');
  const q=document.getElementById('searchBox').value.trim();
  grid.innerHTML='';

  let shown=0, imp=0, drop=0, totalF=0, topF=0;

  students.forEach((s,i)=>{
    const f=final40(s), gr=gradeInfo(f), tc=trendCat(s);
    totalF+=f; if(f>topF) topF=f;
    if(s.trend>=1) imp++;
    if(s.trend<=-1.5) drop++;

    if(activeFilter!=='all'){
      const ok = activeFilter==='top'&&(tc==='top')
              || activeFilter==='up'&&tc==='up'
              || activeFilter==='down'&&tc==='down'
              || activeFilter==='watch'&&tc==='watch';
      if(!ok) return;
    }
    if(q && !s.name.includes(q)) return;
    shown++;

    const rank=i+1;
    const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'#'+rank;

    // Crown for top performers (final >= 34), sad for weak (final < 22)
    let nameDecor = '';
    if(f >= 38){
      nameDecor = `<span class="crown-badge crown-gold" title="الطالب المتميز">👑</span>`;
    } else if(f >= 34){
      nameDecor = `<span class="crown-badge crown-silver" title="طالب متفوق">👑</span>`;
    } else if(f < 22){
      nameDecor = `<span class="sad-badge" title="يحتاج دعماً">😢</span>`;
    }

    const trendH=s.trend>0.3
      ?`<span class="trend-chip trend-up">▲ +${s.trend.toFixed(1)}</span>`
      :s.trend<-0.3
      ?`<span class="trend-chip trend-down">▼ ${s.trend.toFixed(1)}</span>`
      :`<span class="trend-chip trend-flat">مستقر</span>`;

    // Circle math
    const R=44, C=2*Math.PI*R, pct=Math.min(f/40,1), dash=(pct*C).toFixed(1), gap=(C-dash).toFixed(1);
    const spId=`sp${i}`;
    const avgOverall=((s.avg1*5+s.avg2*5)/10).toFixed(2);
    const abPctTotal=((s.abPct1+s.abPct2)/2).toFixed(1);

    const cardEl=document.createElement('div');
    cardEl.className='card';
    cardEl.style.setProperty('--accent', gr.c1);
    cardEl.style.animationDelay=`${shown*0.05}s`;
    cardEl.innerHTML=`
      <div class="card-glow" style="background:${gr.grad}"></div>

      <div class="card-head">
        <div class="rank-badge" style="background:${gr.grad};color:#0a0e1a;font-size:${rank<=3?.95:.8}rem">${medal}</div>
        <div class="card-meta">
          <div class="card-name">${nameDecor}${s.name}</div>
          <div class="card-period">
            <span>فترة ١ → ٢</span>&nbsp;·&nbsp;${trendH}
          </div>
        </div>
      </div>

      <div class="circle-section">
        <div class="circle-wrap" style="width:110px;height:110px">
          <svg width="110" height="110" viewBox="0 0 110 110">
            <defs>
              <linearGradient id="g${i}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${gr.c1}"/>
                <stop offset="100%" stop-color="${gr.c2}"/>
              </linearGradient>
            </defs>
            <circle class="circle-bg" cx="55" cy="55" r="${R}"/>
            <circle class="circle-prog"
              cx="55" cy="55" r="${R}"
              stroke="url(#g${i})"
              stroke-dasharray="${dash} ${gap}"
              stroke-dashoffset="0"
            />
          </svg>
          <div class="circle-inner">
            <div class="circle-score" style="background:${gr.grad};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${f.toFixed(1)}</div>
            <div class="circle-denom">من ٤٠</div>
          </div>
        </div>

        <div class="side-stats">
          <div class="stat-row">
            <div class="stat-icon">📅</div>
            <div class="stat-body">
              <div class="stat-label">نسبة الغياب</div>
              <div class="stat-value" style="color:${abPctTotal>25?'var(--red)':abPctTotal>12?'var(--orange)':'var(--green)'}">${abPctTotal}%</div>
              <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.min(abPctTotal,100)}%;background:${abPctTotal>25?'var(--red)':abPctTotal>12?'var(--orange)':'var(--green)'}"></div></div>
            </div>
          </div>
          <div class="stat-row">
            <div class="stat-icon">📖</div>
            <div class="stat-body">
              <div class="stat-label">مرات لم يحفظ</div>
              <div class="stat-value" style="color:${s.mem>5?'var(--red)':s.mem>2?'var(--orange)':'var(--text)'}">${s.mem} مرة</div>
              <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.min(s.mem/15*100,100)}%;background:${s.mem>5?'var(--red)':s.mem>2?'var(--orange)':'var(--green)'}"></div></div>
            </div>
          </div>
          <div class="stat-row">
            <div class="stat-icon">⭐</div>
            <div class="stat-body">
              <div class="stat-label">المتوسط الأسبوعي</div>
              <div class="stat-value" style="color:${gr.c1}">${avgOverall} / 10</div>
              <div class="stat-bar-wrap"><div class="stat-bar" style="width:${avgOverall*10}%;background:${gr.c1}"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="terms-section">
        <div class="term-row">
          <div class="term-lbl">الفترة ١</div>
          <div class="term-track"><div class="term-fill" style="width:${(s.p1/40*100).toFixed(0)}%;background:${gr.grad}"></div></div>
          <div class="term-val" style="color:${gr.c1}">${s.p1.toFixed(1)}</div>
        </div>
        <div class="term-row">
          <div class="term-lbl">الفترة ٢</div>
          <div class="term-track"><div class="term-fill" style="width:${(s.p2/40*100).toFixed(0)}%;background:${gr.grad}"></div></div>
          <div class="term-val" style="color:${gr.c1}">${s.p2.toFixed(1)}</div>
        </div>
      </div>

      <div class="spark-section">
        <div class="spark-label">مسار الأداء الأسبوعي — ١٠ أسابيع</div>
        <div class="spark-canvas-wrap"><canvas id="${spId}"></canvas></div>
      </div>

      <div class="card-footer">
        <div class="grade-badge" style="background:${gr.grad}">${gr.label}</div>
        <div class="smart-comment">${gr.comment}</div>
      </div>
    `;
    grid.appendChild(cardEl);
  });

  // KPIs
  document.getElementById('kpi-avg').textContent=(totalF/students.length).toFixed(1);
  document.getElementById('kpi-top').textContent=topF.toFixed(1);
  document.getElementById('kpi-imp').textContent=imp;
  document.getElementById('kpi-drop').textContent=drop;
  document.getElementById('grid').insertAdjacentHTML('beforeend',
    shown===0?`<div class="no-res"><span>🔍</span>لا توجد نتائج مطابقة</div>`:''
  );

  // Sparklines
  setTimeout(()=>{
    students.forEach((s,i)=>{
      if(sparkCache[i]) return;
      const el=document.getElementById(`sp${i}`);
      if(!el) return;
      const f=final40(s), gr=gradeInfo(f);
      const ptC=s.scores.map(v=>v>=9?'#22d3a5':v>=7?'#4f8ef7':v>=5?'#ff8c42':'#ff4d6d');
      sparkCache[i]=new Chart(el,{
        type:'line',
        data:{
          labels:s.scores.map((_,j)=>j+1),
          datasets:[{
            data:s.scores,
            borderColor:gr.c1,
            borderWidth:1.5,
            pointBackgroundColor:ptC,
            pointRadius:3,
            pointHoverRadius:5,
            tension:.4,
            fill:true,
            backgroundColor:(ctx)=>{
              const g=ctx.chart.ctx.createLinearGradient(0,0,0,44);
              g.addColorStop(0, gr.c1+'33');
              g.addColorStop(1, gr.c1+'00');
              return g;
            }
          }]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          animation:{duration:800},
          plugins:{legend:{display:false},tooltip:{
            backgroundColor:'rgba(15,22,41,.9)',
            titleColor:'#f0f4ff', bodyColor:'#7b8db0',
            callbacks:{label:v=>`أسبوع ${v.dataIndex+1}: ${v.raw}/10`}
          }},
          scales:{x:{display:false},y:{display:false,min:0,max:10}}
        }
      });
    });
  },80);
}

function setF(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on','f-'+f);
  // clear other f-* from btn
  ['all','top','up','down','watch'].forEach(x=>{ if(x!==f) btn.classList.remove('f-'+x); });
  Object.keys(sparkCache).forEach(k=>{ try{sparkCache[k].destroy();}catch(e){} delete sparkCache[k]; });
  render();
}

render();
</script>
</body>
</html>
